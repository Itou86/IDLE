<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>IDLE 游戏测试套件</title>
    <style>
        :root { --bg: #1a1a2e; --panel: #16213e; --text: #eee; --pass: #4caf50; --fail: #f44336; --warn: #ff9800; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; padding: 20px; }
        h1 { text-align: center; margin-bottom: 20px; }
        .summary { display: flex; gap: 20px; justify-content: center; margin-bottom: 20px; }
        .summary-box { background: var(--panel); padding: 16px 24px; border-radius: 8px; text-align: center; }
        .summary-box .num { font-size: 2rem; font-weight: bold; }
        .pass { color: var(--pass); }
        .fail { color: var(--fail); }
        .warn { color: var(--warn); }
        .suite { background: var(--panel); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
        .suite-header { padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .suite-header:hover { background: rgba(255,255,255,0.05); }
        .suite-body { display: none; }
        .suite.open .suite-body { display: block; }
        .test { padding: 10px 16px; border-bottom: 1px solid #2a2a4a; display: flex; align-items: flex-start; gap: 12px; }
        .test:last-child { border-bottom: none; }
        .status { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; margin-top: 2px; }
        .status.pass { background: var(--pass); color: #fff; }
        .status.fail { background: var(--fail); color: #fff; }
        .status.warn { background: var(--warn); color: #000; }
        .test-content { flex: 1; }
        .test-name { font-weight: bold; margin-bottom: 4px; }
        .test-msg { color: #aaa; font-size: 0.9rem; }
        .test-error { color: var(--fail); font-size: 0.85rem; margin-top: 4px; font-family: monospace; }
        .toggle-all { text-align: center; margin-bottom: 16px; }
        .toggle-all button { background: var(--panel); color: var(--text); border: 1px solid #444; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .toggle-all button:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <h1>🧪 IDLE 游戏测试套件</h1>
    <div class="summary">
        <div class="summary-box"><div class="num" id="total">0</div><div>总测试</div></div>
        <div class="summary-box"><div class="num pass" id="passed">0</div><div>通过</div></div>
        <div class="summary-box"><div class="num fail" id="failed">0</div><div>失败</div></div>
        <div class="summary-box"><div class="num warn" id="warnings">0</div><div>警告</div></div>
    </div>
    <div class="toggle-all"><button onclick="toggleAll()">展开/折叠全部</button></div>
    <div id="results"></div>

    <!-- 加载游戏代码 -->
    <script src="../js/config/cards.js"></script>
    <script src="../js/config/achievements.js"></script>
    <script src="../js/config/stages.js"></script>
    <script src="../js/utils/formatter.js"></script>
    <script src="../js/systems/save.js"></script>
    <script src="../js/systems/gacha.js"></script>
    <script src="../js/systems/battle.js"></script>
    <script src="../js/systems/achievement.js"></script>

    <!-- 测试框架 -->
    <script src="test-framework.js"></script>
    <!-- 测试用例 -->
    <script src="test-formatter.js"></script>
    <script src="test-config.js"></script>
    <script src="test-gacha.js"></script>
    <script src="test-battle.js"></script>
    <script src="test-achievement.js"></script>
    <script src="test-save.js"></script>
    <script src="test-integration.js"></script>
    <script src="test-idle.js"></script>
    <script src="test-shop.js"></script>
    <script src="test-stats.js"></script>

    <script>
        // 运行所有测试
        TestRunner.runAll();

        function toggleAll() {
            document.querySelectorAll('.suite').forEach(s => s.classList.toggle('open'));
        }

        // 点击 suite header 切换
        document.addEventListener('click', e => {
            const header = e.target.closest('.suite-header');
            if (header) header.parentElement.classList.toggle('open');
        });
    </script>
</body>
</html>
