name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建阶段
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: ""  # 纯静态站点，无构建工具

      - name: Verify file structure
        run: |
          echo "=== 项目文件结构 ==="
          ls -la
          echo ""
          echo "=== HTML 文件 ==="
          find . -name "*.html" -not -path "./.git/*"
          echo ""
          echo "=== JS 文件 ==="
          find . -name "*.js" -not -path "./.git/*" | head -20
          echo ""
          echo "=== CSS 文件 ==="
          find . -name "*.css" -not -path "./.git/*"

      - name: Check index.html exists
        run: |
          if [ ! -f "index.html" ]; then
            echo "❌ 错误：index.html 不存在！"
            exit 1
          fi
          echo "✅ index.html 存在"

      - name: Validate HTML links
        run: |
          # 检查 CSS 引用
          if grep -q 'href="css/style.css"' index.html; then
            if [ ! -f "css/style.css" ]; then
              echo "⚠️ 警告：index.html 引用了 css/style.css 但文件不存在"
            else
              echo "✅ CSS 文件引用正确"
            fi
          fi
          
          # 检查 JS 引用
          for js_file in $(grep -oP 'src="\K[^"]+\.js' index.html || true); do
            if [ -f "$js_file" ]; then
              echo "✅ JS 引用正确: $js_file"
            else
              echo "⚠️ 警告：JS 文件不存在: $js_file"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: github-pages

  # 部署阶段
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
